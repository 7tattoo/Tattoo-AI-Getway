plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aigetway.tattoo7'
    compileSdk 34

    defaultConfig {
        applicationId 'com.aigetway.tattoo7'
        minSdk 26
        targetSdk 34
        versionCode 181
        versionName "1.0.65"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // UI 只用到 Theme.AppCompat / SwitchCompat / AppCompatActivity，不引 Material（体积大头）
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // appcompat 1.6.1 默认拉 activity 1.6.0（无 EdgeToEdge），钉到 1.9.0
    implementation 'androidx.activity:activity:1.9.0'
    // 对齐 kotlin-stdlib / jdk7 / jdk8 版本，消 duplicate class（1.8 起 jdk7/jdk8 是空壳）
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
}